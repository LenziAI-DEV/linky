# Tabela de preços versionada (US$ por milhão de tokens). Lida por linky_agents.harness.
# Fonte: páginas oficiais de preço de cada fornecedor, consultadas em 10/11/2026
# (links em docs/discovery/g-pesquisas.md §3). Versão anterior: 2026-11-05 (briefing §11).
# Mudou o preço? Crie uma nova versão (troque `version`): cada execução grava a versão usada.
#
# cached_input = leitura de cache; cache_write = escrita de cache. Vazios = cobrados como
# entrada cheia (conservador). Limite conhecido: o fornecedor OpenAI do harness ainda não lê
# `prompt_tokens_details.cache_write_tokens`, então a escrita de cache do gpt-6-luna (1,25×)
# entra no ledger como entrada a 1× (subestima só a parte escrita; ver g-pesquisas.md §3).

version: "2026-11-10"
currency: USD
per_tokens: 1000000

models:
  # OpenAI (padrão). gpt-5-nano e gpt-5-mini saem da API em 11/12/2026 (substitutos oficiais:
  # gpt-5.6-luna e gpt-5.6-terra); ficam aqui só para o histórico e para o T7 até lá.
  openai/gpt-6-luna:   {input: 0.10, output: 0.50, cached_input: 0.01, cache_write: 0.125}
  openai/gpt-5.6-luna: {input: 0.20, output: 1.20, cached_input: 0.02, cache_write: 0.25}
  openai/gpt-5.4-mini: {input: 0.75, output: 4.50, cached_input: 0.075}
  openai/gpt-5-nano:   {input: 0.05, output: 0.40, cached_input: 0.005}
  openai/gpt-5-mini:   {input: 0.25, output: 2.00, cached_input: 0.025}

  # DeepSeek: preço cheio no pico (01–04h e 06–10h UTC, seg a sex); metade fora dele.
  # Feriados chineses também são fora do pico, mas o harness não os conhece: cobra como pico
  # (superestima). deepseek-v4-flash é o nome antigo: a API ainda aceita e cobra como Flash.
  deepseek/deepseek-flash:
    input: 0.30
    cached_input: 0.006
    output: 1.20
    offpeak: {factor: 0.5, peak_utc: ["01:00-04:00", "06:00-10:00"], weekdays_only: true}
  deepseek/deepseek-v4-flash:
    input: 0.30
    cached_input: 0.006
    output: 1.20
    offpeak: {factor: 0.5, peak_utc: ["01:00-04:00", "06:00-10:00"], weekdays_only: true}
  deepseek/deepseek-v4-pro:
    input: 1.32
    cached_input: 0.044
    output: 3.96
    offpeak: {factor: 0.5, peak_utc: ["01:00-04:00", "06:00-10:00"], weekdays_only: true}

  # Anthropic: escrita de cache (5 min) a 1,25× a entrada. Leitura: 0,1× no Haiku 5.5 e
  # 0,05× no Sonnet e no Opus 5.5. Haiku 5.5 vale até 100 mil tokens de entrada (acima disso,
  # 5×; nenhum agente passa de 15 mil).
  anthropic/claude-haiku-5-5:  {input: 0.10, output: 0.50, cached_input: 0.01, cache_write: 0.125}
  anthropic/claude-sonnet-5-5: {input: 2.00, output: 10.00, cached_input: 0.10, cache_write: 2.50}
  anthropic/claude-opus-5-5:   {input: 4.00, output: 20.00, cached_input: 0.20, cache_write: 5.00}
