[project]
name = "linky-agents"
version = "0.1.0"
description = "Harness de agentes do linky-dev: coleta, curadoria e redação para o LinkedIn"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "fonttools>=4.50",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "resvg-py>=0.5",
    "tzdata>=2024.1",
    "uharfbuzz>=0.40",
]

[project.scripts]
linky-collect = "linky_agents.collect:main"
linky-render = "linky_agents.render.cli:main"
linky-gold = "linky_agents.gold:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linky_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Marcação SVG em f-strings: quebrar as linhas piora a leitura da geometria
"src/linky_agents/render/layouts.py" = ["E501"]
# Direção de arte do T2: geometria de SVG escrita à mão
"tools/t2_art/*" = ["E501"]
